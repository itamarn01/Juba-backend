<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>JUBA Admin</title>
  </head>
  <body>
    <div id="login" class="login hidden">
      <form id="login-form" class="login-card">
        <h1>JUBA Admin</h1>
        <input id="email" type="email" placeholder="אימייל" autocomplete="username" required />
        <input id="password" type="password" placeholder="סיסמה" autocomplete="current-password" required />
        <button type="submit">התחברות</button>
        <p id="login-error" class="error"></p>
      </form>
    </div>

    <div id="app" class="hidden">
      <header>
        <h1>JUBA Admin</h1>
        <div class="header-actions">
          <button id="refresh" class="ghost">רענון</button>
          <button id="logout" class="ghost">התנתקות</button>
        </div>
      </header>

      <main>
        <section id="stats" class="stats"></section>

        <nav class="tabs">
          <button data-tab="devices" class="active">משתמשים</button>
          <button data-tab="tips">טיפים</button>
        </nav>

        <section id="devices-tab">
          <div class="toolbar">
            <input id="search" type="search" placeholder="חיפוש לפי מזהה מכשיר" />
            <select id="filter">
              <option value="all">כולם</option>
              <option value="online">מחוברים עכשיו</option>
              <option value="today">פעילים היום</option>
              <option value="tippers">נתנו טיפ</option>
              <option value="adfree">בלי פרסומות</option>
            </select>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>מזהה</th>
                  <th>נראה לאחרונה</th>
                  <th>הותקן</th>
                  <th>פתיחות</th>
                  <th>גרסה</th>
                  <th>שפה</th>
                  <th>טיפים</th>
                  <th>פרסומות</th>
                  <th>הערה</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="devices-body"></tbody>
            </table>
          </div>
          <div class="pager">
            <button id="prev" class="ghost">הקודם</button>
            <span id="page-label"></span>
            <button id="next" class="ghost">הבא</button>
          </div>
        </section>

        <section id="tips-tab" class="hidden">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>תאריך</th>
                  <th>מוצר</th>
                  <th>סכום</th>
                  <th>מכשיר</th>
                  <th>מספר הזמנה</th>
                </tr>
              </thead>
              <tbody id="tips-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
